[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-auto-checkin"
version = "1.0.0"
description = "Configuration-driven daily Telegram check-in with TOML settings and GitHub Actions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "telethon>=1.36,<2",
  "rich>=13.7,<16",
  "python-socks[asyncio]>=2.4,<3",
]

[project.scripts]
auto-checkin = "auto_checkin.cli:main"

[tool.setuptools.packages.find]
include = ["auto_checkin*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
