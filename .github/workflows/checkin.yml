name: Telegram Daily Checkin

on:
  schedule:
    # 07:00 WIB = 00:00 UTC — primary slot
    - cron: '0 0 * * *'
    # Backup slot 08:10 WIB: GitHub drops scheduled ticks under load, and the
    # script exits early when the account already checked in today, so a
    # redundant run costs a minute of CI and nothing else.
    - cron: '10 1 * * *'
  workflow_dispatch:

permissions:
  actions: write    # prune old runs
  contents: write   # monthly heartbeat commit (keeps schedules alive)

concurrency:
  group: telegram-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify secrets are present
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSIONS: ${{ secrets.SESSIONS }}
        run: |
          missing=""
          [ -z "$API_ID" ]   && missing="$missing API_ID"
          [ -z "$API_HASH" ] && missing="$missing API_HASH"
          [ -z "$SESSIONS" ] && missing="$missing SESSIONS"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing"
            exit 1
          fi
          echo "credentials: present"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checkin
        env:
          API_ID:       ${{ secrets.API_ID }}
          API_HASH:     ${{ secrets.API_HASH }}
          SESSIONS:     ${{ secrets.SESSIONS }}
          BOTS:         ${{ secrets.BOTS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
        run: python checkin.py

      # GitHub disables every scheduled workflow in a repository after 60 days
      # without repository activity — that is what killed this job on
      # 2026-09-14 (last push 2026-07-16). A monthly commit from the scheduled
      # run itself keeps the repo active with no external scheduler.
      - name: Monthly activity heartbeat
        if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%d)" != "01" ]; then
            echo "not the 1st — skipping heartbeat"
            exit 0
          fi
          mkdir -p .github
          printf 'last scheduled run: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/heartbeat.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat.txt
          git commit -m "chore: monthly activity heartbeat" || exit 0
          git push

      - name: Prune old runs
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow "${{ github.workflow }}" --limit 50 \
            --json databaseId,status \
            --jq '.[] | select(.status == "completed") | .databaseId' |
          while read -r id; do
            [ -z "$id" ] && continue
            [ "$id" = "${{ github.run_id }}" ] && continue
            gh run delete "$id" >/dev/null 2>&1 && echo "deleted run $id" || true
          done
          echo "cleanup done"
