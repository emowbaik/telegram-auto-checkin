name: Telegram Daily Checkin

on:
  schedule:
    # 07:00 WIB = 00:00 UTC — primary slot
    - cron: '0 0 * * *'
    # 22:00 WIB backup, well clear of the primary slot; a duplicate check-in is harmless.
    - cron: '0 15 * * *'
  workflow_dispatch:

# This job holds all Telegram credentials: it must not carry repository write
# tokens, and its execution history is retained for audit.
permissions:
  contents: read

concurrency:
  group: telegram-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify required secrets
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSIONS: ${{ secrets.SESSIONS }}
        run: |
          missing=""
          [ -z "$API_ID" ]   && missing="$missing API_ID"
          [ -z "$API_HASH" ] && missing="$missing API_HASH"
          [ -z "$SESSIONS" ] && missing="$missing SESSIONS"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing"
            exit 1
          fi
          echo "credentials: present"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Run checkin
        env:
          API_ID:       ${{ secrets.API_ID }}
          API_HASH:     ${{ secrets.API_HASH }}
          SESSIONS:     ${{ secrets.SESSIONS }}
          BOTS:         ${{ secrets.BOTS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
        run: python main.py --non-interactive --strict
